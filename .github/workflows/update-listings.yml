name: Update listings

on:
  schedule:
    - cron: "0 * * * *"   # minute 0 past every hour ; keeps data well inside eBay's 6-hour limit
  workflow_dispatch:       # manual run button

permissions:
  contents: write
  actions: write           # lets us trigger the deploy workflow below

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Sync eBay listings
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_SELLER: ${{ vars.EBAY_SELLER }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}
          EBAY_MARKETPLACE: ${{ vars.EBAY_MARKETPLACE || 'EBAY_GB' }}
          KEEP_ENDED_DAYS: "36500"   # ~100 years: ended listings are never removed
          ENDED_STATUS: "sold"       # status given to listings that have ended
        run: python scripts/sync_ebay_listings.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/listings.json public/data/listings-meta.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update listings from eBay"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do NOT trigger other workflows, so the
      # "on: push" trigger in deploy-pages.yml will not fire for our commit.
      # deploy-pages.yml has workflow_dispatch, so we start it explicitly.
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml